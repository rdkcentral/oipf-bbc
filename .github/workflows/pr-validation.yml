name: PR Validation

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  test:
    name: "Unit Testing"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Tests
        run: npm run build

      - name: Run Tests
        run: npm run test
