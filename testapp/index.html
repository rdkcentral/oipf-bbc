<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>oipf-bbc integration test app</title>
    </head>
    <body>
        <header id="appHeader">
            <span id="appTitle">oipf-bbc test app</span>
            <span id="appStatus">loading&hellip;</span>
        </header>

        <main id="appBody">
            <nav id="menu" tabindex="0">
                <div id="menuBreadcrumb"></div>
                <div id="menuCaption"></div>
                <div id="menuViewport">
                    <div id="menuScroll"></div>
                    <div id="menuScrollUp" class="scrollHint" aria-hidden="true">&#9650;</div>
                    <div id="menuScrollDown" class="scrollHint" aria-hidden="true">&#9660;</div>
                </div>
            </nav>
            <section id="results">
                <h2 id="resultsTitle">Select a test group</h2>
                <div id="resultsViewport">
                    <div id="resultsScroll">
                        <div id="resultsList"></div>
                    </div>
                    <div id="scrollUp" class="scrollHint" aria-hidden="true">&#9650;</div>
                    <div id="scrollDown" class="scrollHint" aria-hidden="true">&#9660;</div>
                </div>
            </section>
        </main>

        <section id="logPane">
            <div id="logHeader">Log</div>
            <div id="logList"></div>
        </section>

        <!-- Autorun report (modal overlay, hidden until a "Run all" is started). -->
        <div id="popup" class="popup" aria-hidden="true">
            <div class="popupPanel">
                <div class="popupHeader">
                    <span id="popupTitle"></span>
                    <span id="popupSummary"></span>
                </div>
                <div id="popupViewport">
                    <div id="popupScroll">
                        <div id="popupList"></div>
                    </div>
                    <div id="popupScrollUp" class="scrollHint" aria-hidden="true">&#9650;</div>
                    <div id="popupScrollDown" class="scrollHint" aria-hidden="true">&#9660;</div>
                </div>
                <div id="popupFooter" class="popupFooter"></div>
            </div>
        </div>

        <!-- Exit confirmation (modal overlay, hidden until Back is pressed with no history left). -->
        <div id="exitConfirm" class="confirm" aria-hidden="true">
            <div class="confirmPanel">
                <div id="exitConfirmMessage" class="confirmMessage"></div>
                <div class="confirmButtons">
                    <div id="exitConfirmYes" class="confirmButton">Yes</div>
                    <div id="exitConfirmNo" class="confirmButton">No</div>
                </div>
            </div>
        </div>

        <!--
            No manual <script> list here: webpack builds src/index.js (which pulls in
            harness.css, every test module in registration order, and loader.js last)
            into a single bundle that HtmlWebpackPlugin injects automatically.

            The library itself is intentionally NOT a static import — harness/loader.js
            decides at runtime whether to inject the local stb/oipf-bbc.js copy (relative
            to this app's own root — see webpack.config.js's CopyWebpackPlugin step,
            which copies dist/stb/ into this build's own output) or bind to a
            platform-injected instance.
        -->
    </body>
</html>
