<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>oipf-bbc integration test app</title>
        <link rel="stylesheet" type="text/css" href="harness/harness.css">
    </head>
    <body>
        <header id="appHeader">
            <span id="appTitle">oipf-bbc test app</span>
            <span id="appStatus">loading&hellip;</span>
        </header>

        <main id="appBody">
            <nav id="menu" tabindex="0"></nav>
            <section id="results">
                <h2 id="resultsTitle">Select a test group</h2>
                <div id="resultsViewport">
                    <div id="resultsScroll">
                        <div id="resultsList"></div>
                    </div>
                    <div id="scrollUp" class="scrollHint" aria-hidden="true">&#9650;</div>
                    <div id="scrollDown" class="scrollHint" aria-hidden="true">&#9660;</div>
                </div>
            </section>
        </main>

        <section id="logPane">
            <div id="logHeader">Log</div>
            <div id="logList"></div>
        </section>

        <!--
            The library is intentionally NOT loaded with a static <script> tag here.
            harness/loader.js decides whether to inject the local ../dist/stb/oipf-bbc.js
            copy or bind to a platform-injected (auto-loaded) instance. See the plan /
            the loader source for the two supported environments.
        -->
        <script src="harness/harness.js"></script>
        <script src="tests/objectFactory.js"></script>
        <script src="tests/displayInfo.js"></script>
        <script src="tests/configuration.js"></script>
        <script src="tests/applicationManager.js"></script>
        <script src="tests/videoBroadcast.js"></script>
        <script src="harness/loader.js"></script>
    </body>
</html>
